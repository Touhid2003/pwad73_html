<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>BASIC HTML FORM</title>
</head>
<body>
    <h1>Basic Html Form</h1>
    <form action="">
    <label for="">First Name: </label> <br>

    <label for="">Last Name: </label> <br>
    <input type="text" name="lName" placeholder="Enter Last Name" value=""> <br>
    <label for="">Adress: </label> <br>
    <textarea name="Adress" placeholder="Enter your address" id="" rows="10" cols="20"></textarea> <br>     
    <label for="">Gender: </label> <br> 
    <input type="radio" name="Gender" value="m"> Male
    <input type="radio" name="Gender" value="f"> Female
    <input type="radio" name="Gender" value="o"> Others <br>
     <label for="">District: </label> <br> 
     
     <select  name="District">
        <option value="" disabled> Select One</option>
        <option value="2"> Dhaka</option>
        <option value="3"> Bogura</option>
        <option value="4"> Sylhet</option>
        <option value="5"> Khulna</option>
     </select> <br> <br>

     <input type="submit" name="submit" id="" value="send">
     <input type="reset" name="reset" id="" value="Reset">
   

    </form>
    <br> <br>
    
</body>
